<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head>
<body style="margin:0">
<title>Scopa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one card table — opponent across the top, green felt in the middle, your hand at the bottom. Single deliberate look (felt table), works on any host background. */
:root{
  --felt:#245442; --felt-deep:#173a2c; --felt-line:#3a6b57;
  --brass:#d6ac55; --brass-soft:rgba(214,172,85,.18);
  --cream:#f6efdf; --ink:#2b2218; --ink-soft:#6c5f4c; --wine:#8c2c2a;
  --text:#ede7d7; --muted:#a8bdac;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --cw:clamp(52px, 14.5vw, 82px);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none !important}
.sheet{color-scheme:light}
.sheet input[type=checkbox],.sheet input[type=radio]{accent-color:var(--wine)}
body{
  background-color:var(--felt-deep);
  background-image:radial-gradient(ellipse 80% 70% at 50% 45%, var(--felt) 0%, var(--felt-deep) 100%);
  background-attachment:fixed;
  color:var(--text); font-family:var(--body); font-size:16px; line-height:1.4;
}
.app{
  max-width:920px; margin:0 auto; min-height:100%; box-sizing:border-box;
  display:flex; flex-direction:column; gap:12px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand{font-family:var(--display); font-weight:700; font-size:24px; letter-spacing:.12em; color:var(--brass); margin:0}
.score{display:flex; align-items:baseline; gap:10px; font-variant-numeric:tabular-nums}
.score b{font-family:var(--display); font-size:24px; color:var(--cream)}
.score em{font-style:normal; color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.08em}
.score .sep{color:var(--brass)}
.score small{color:var(--muted); font-size:13px; margin-left:6px}
.btn{
  font:inherit; font-weight:500; cursor:pointer; border-radius:6px; padding:8px 14px;
  border:1px solid var(--brass); background:transparent; color:var(--brass);
}
.btn:hover{background:var(--brass-soft)}
.btn:focus-visible,.card:focus-visible{outline:3px solid var(--brass); outline-offset:3px}
.btn.primary{background:var(--brass); color:var(--ink)}
.btn.primary:hover{background:#e4bd69}

.zone{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.who{font-family:var(--display); font-size:15px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{font-size:13px; padding:3px 10px; border-radius:999px; border:1px solid var(--felt-line); color:var(--muted); font-variant-numeric:tabular-nums}
.chip b{color:var(--cream); font-weight:700}
.chip.hot{border-color:var(--brass); color:var(--brass)}
.chip.hot b{color:var(--brass)}
.row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-width:0}

.card{
  width:var(--cw); aspect-ratio:60/92; max-width:100%; border-radius:6px; flex:none;
  box-shadow:0 2px 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.28);
  background:var(--cream); position:relative; transition:transform .18s ease, box-shadow .18s ease;
}
.card svg{display:block; width:100%; height:100%}
.back{
  --cw:clamp(34px, 9vw, 50px);
  background:var(--wine);
  background-image:repeating-linear-gradient(45deg, rgba(246,239,223,.16) 0 2px, transparent 2px 7px),
                   repeating-linear-gradient(-45deg, rgba(246,239,223,.16) 0 2px, transparent 2px 7px);
  border:3px solid var(--cream); box-sizing:border-box;
}
.opp-cards{display:flex; gap:6px}

.table{
  flex:1; position:relative; border:1px solid var(--felt-line); border-radius:16px;
  min-height:calc(var(--cw) * 1.53 + 56px);
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; align-content:center; justify-content:center;
  padding:16px 14px; box-shadow:inset 0 0 40px rgba(0,0,0,.22);
}
.deckpile{position:relative; flex:none; width:calc(var(--cw-pile) + 6px); height:calc(var(--cw-pile) * 1.53 + 6px); margin-right:10px; align-self:center}
.deckpile .card.back{--cw:var(--cw-pile); position:absolute; left:calc(var(--i) * 3px); top:calc(var(--i) * -3px + 6px); border-width:2px; box-shadow:0 2px 4px rgba(0,0,0,.35)}
.deckpile b{position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); z-index:2; min-width:24px; padding:1px 6px; border-radius:999px; background:var(--felt-deep); color:var(--cream); border:1px solid var(--brass); font-size:12px; text-align:center; font-variant-numeric:tabular-nums}
.handrow{display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:8px}
.mypile{justify-self:start; display:flex; flex-direction:column; align-items:center; gap:4px; padding-bottom:2px}
.pilelbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.cpile{--pw:var(--cw-pile); position:relative; flex:none; width:calc(var(--pw) + 10px); height:calc(var(--pw) * 1.53 + 10px)}
.cpile .card.back{--cw:var(--pw); position:absolute; left:5px; top:5px; border-width:2px; transform:rotate(var(--r)); box-shadow:0 2px 4px rgba(0,0,0,.35)}
.cpile.empty::before{content:""; position:absolute; inset:5px; border:1.5px dashed var(--felt-line); border-radius:6px}
.cpile b{position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); z-index:2; min-width:22px; padding:1px 6px; border-radius:999px; background:var(--felt-deep); color:var(--cream); border:1px solid var(--brass); font-size:12px; text-align:center; font-variant-numeric:tabular-nums}
.cpile.empty b{display:none}
.opp-body{display:flex; align-items:center; justify-content:space-between; gap:8px}
.opp .cpile{--pw:clamp(22px, 6vw, 30px)}
.opp .cpile b{font-size:11px; min-width:18px; padding:0 4px}
.card.flying{pointer-events:none; transition:none}
.deckpile.gone{visibility:hidden; width:0; margin-right:0}
.empty{color:var(--muted); font-style:italic}
.card.target{transform:translateY(-6px); box-shadow:0 0 0 3px var(--brass), 0 10px 18px rgba(0,0,0,.35)}
.card.taken{box-shadow:0 0 0 3px var(--brass), 0 10px 18px rgba(0,0,0,.35); animation:pulse .5s ease-in-out infinite alternate}
.card.incoming{box-shadow:0 0 0 3px var(--cream), 0 10px 18px rgba(0,0,0,.35); animation:drop .35s ease-out}
.card.incoming.opp{box-shadow:0 0 0 3px var(--wine), 0 0 0 5px var(--cream)}
@keyframes drop{from{transform:translateY(-24px) scale(1.06); opacity:.2}to{transform:none; opacity:1}}
@keyframes pulse{from{transform:translateY(-4px)}to{transform:translateY(-8px)}}

.msg{text-align:center; color:var(--muted); font-style:italic; min-height:1.4em; margin:0}
.hand{display:flex; gap:10px; justify-content:center; padding-top:10px; min-height:calc(var(--cw) * 1.53 + 10px)}
button.card{border:0; padding:0; cursor:pointer; font:inherit}
button.card:disabled{cursor:default}
button.card:not(:disabled):hover{transform:translateY(-5px)}
button.card.sel{transform:translateY(-12px); box-shadow:0 0 0 3px var(--brass), 0 12px 20px rgba(0,0,0,.35)}
.hand.wait button.card{filter:saturate(.75) brightness(.92)}

.opts{min-height:44px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center}
.opts p{margin:0; color:var(--muted); width:100%; text-align:center; font-size:14px}

.overlay{
  position:fixed; inset:0; z-index:20; background:rgba(12,28,21,.78);
  display:flex; align-items:center; justify-content:center; overflow:auto;
  padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.sheet{
  background:var(--cream); color:var(--ink); border-radius:12px; width:100%; max-width:470px;
  padding:24px; box-sizing:border-box; box-shadow:0 20px 50px rgba(0,0,0,.45); margin:auto;
  display:flex; flex-direction:column; gap:16px;
}
.sheet h2{font-family:var(--display); font-size:26px; letter-spacing:.06em; margin:0; color:var(--wine); text-wrap:balance}
.sheet p{margin:0; color:var(--ink-soft)}
.field{display:flex; flex-direction:column; gap:8px}
.field > span{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700}
.seg{display:flex; gap:8px}
.seg label{flex:1; position:relative}
.seg input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.seg label span{display:block; text-align:center; padding:9px; border:1px solid #cdbf9f; border-radius:6px; font-weight:500}
.seg input:checked + span{background:var(--wine); border-color:var(--wine); color:var(--cream)}
.seg input:focus-visible + span{outline:3px solid var(--brass); outline-offset:2px}
.check{display:flex; gap:10px; align-items:flex-start; cursor:pointer}
.check input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--wine); flex:none}
.check small{display:block; color:var(--ink-soft); font-size:14px; margin-top:2px}
.sheet .btn{border-color:var(--wine); color:var(--wine)}
.sheet .btn:hover{background:rgba(140,44,42,.08)}
.sheet .btn.primary{background:var(--wine); color:var(--cream)}
.sheet .btn.primary:hover{background:#a03432}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.actions .btn{flex:1; padding:11px 14px}
details{border-top:1px solid #e0d5bb; padding-top:12px}
summary{cursor:pointer; font-weight:700; color:var(--wine)}
details ul{margin:10px 0 0; padding-left:18px; color:var(--ink-soft); font-size:14px; display:flex; flex-direction:column; gap:4px}

table.sum{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.sum th,.sum td{padding:7px 6px; border-bottom:1px solid #e3d9c2; text-align:center}
.sum th:first-child{text-align:left; font-weight:500}
.sum thead th{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft)}
.sum td.win{font-weight:700}
.sum .pt{display:inline-block; margin-left:6px; padding:0 6px; border-radius:999px; background:var(--wine); color:var(--cream); font-size:12px; font-weight:700}
.sum tfoot th,.sum tfoot td{border-bottom:0; font-weight:700}
.sum tfoot tr.total td{font-family:var(--display); font-size:20px; color:var(--wine)}
.note{font-size:14px}

.flash{
  position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
  pointer-events:none; animation:flash 1.3s ease forwards;
}
.flash b{font-family:var(--display); font-size:clamp(48px, 14vw, 88px); color:var(--brass); letter-spacing:.08em; text-shadow:0 4px 18px rgba(0,0,0,.55)}
.flash span{color:var(--cream); font-size:18px; text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes flash{0%{opacity:0; transform:scale(.7)}18%{opacity:1; transform:scale(1.05)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}


/* multi-player additions */
:root{--cw-pile:clamp(34px, 9vw, 48px); --cw-main:clamp(52px, 14.5vw, 82px); --cw-hand:clamp(66px, 19vw, 106px); --team-a:#e0b25a; --team-b:#9fc6e8}
.score{flex-wrap:wrap; row-gap:2px}
.sc{display:inline-flex; align-items:baseline; gap:6px}
.sc.t0 em{color:var(--team-a)} .sc.t1 em{color:var(--team-b)}
.opps{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px}
.opp{border:1px solid var(--felt-line); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; min-width:0; transition:border-color .2s, box-shadow .2s}
.opp.active{border-color:var(--brass); box-shadow:0 0 0 1px var(--brass), 0 0 18px rgba(214,172,85,.18)}
.opp .top{display:flex; justify-content:space-between; align-items:center; gap:6px; min-width:0}
.opp .name{font-weight:700; color:var(--cream); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.opp .back{--cw:clamp(24px, 6.5vw, 34px); border-width:2px}
.opp .none{font-size:13px; color:var(--muted); font-style:italic}
.tags{display:flex; gap:4px; flex:none}
.tag,.team{font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; border-radius:999px; border:1px solid var(--felt-line); color:var(--muted)}
.team.t0{border-color:var(--team-a); color:var(--team-a)}
.team.t1{border-color:var(--team-b); color:var(--team-b)}
.me{display:flex; gap:8px; align-items:center}
.hand{--cw:var(--cw-hand); align-items:flex-start; min-width:calc(var(--cw-hand) * 3 + 20px)}
.hand .back{--cw:var(--cw-hand); border-width:3px}
.seats .seat{display:grid; grid-template-columns:18px minmax(0,1fr) 7.4em 36px; gap:8px; align-items:center}
.seats.teams .seat{grid-template-columns:18px minmax(0,1fr) 7.4em 36px auto}
.seats select{width:100%}
@media (max-width:480px){ .seats .seat, .seats.teams .seat{column-gap:6px} .seats .seat{grid-template-columns:16px minmax(0,1fr) 7.3em 34px} .seats.teams .seat{grid-template-columns:16px minmax(0,1fr) 7.3em 34px auto} .seats select{padding-inline:6px} .reroll{width:34px;height:34px} }
.reroll{font:inherit; font-size:18px; line-height:1; width:36px; height:36px; border:1px solid #cdbf9f; border-radius:6px; background:#fffaf0; color:var(--wine); cursor:pointer}
.reroll:hover{background:#f3e8d0}
.reroll.off{visibility:hidden}
.reroll:focus-visible{outline:3px solid var(--brass); outline-offset:1px}
.seats .num{font-family:var(--display); font-weight:700; color:var(--wine); text-align:center}
.seats input[type=text],.seats select{font:inherit; padding:8px 10px; border:1px solid #cdbf9f; border-radius:6px; background:#fffaf0; color:var(--ink); min-width:0}
.seats input[type=text]:focus-visible,.seats select:focus-visible{outline:3px solid var(--brass); outline-offset:1px}
.seats [data-team]{display:none; border-color:#cdbf9f}
.seats.teams [data-team]{display:inline-block}
.seats .team.t0{color:#9a6a12; border-color:#d6b46a} .seats .team.t1{color:#2f5d8a; border-color:#9ab9d6}
.hint{font-size:14px}
.sheet input[type=text]{font:inherit; padding:8px 10px; border:1px solid #cdbf9f; border-radius:6px; background:#fffaf0; color:var(--ink); min-width:0}
.sheet input[type=text]:focus-visible{outline:3px solid var(--brass); outline-offset:1px}
.online{display:flex; flex-direction:column; gap:8px}
.online .lbl{font-weight:700; font-size:14px; color:var(--ink)}
.join{display:flex; gap:8px}
.join input{flex:1; text-transform:uppercase; letter-spacing:.3em; font-weight:700}
.err{margin:0; color:var(--wine) !important; font-weight:700; font-size:14px}
.err:empty{display:none}
.codebox{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 16px; border:1px dashed #cdbf9f; border-radius:8px; background:#fbf6ea}
.codebox .actions{flex:none}
.codebox .btn{white-space:nowrap}
.codebox b{font-family:var(--display); font-size:40px; letter-spacing:.18em; color:var(--wine); font-variant-numeric:tabular-nums}
.linktext{word-break:break-all; user-select:all}
ul.lobby{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
ul.lobby li{display:grid; grid-template-columns:18px minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:8px 10px; border:1px solid #e0d5bb; border-radius:6px; background:#fffaf0}
ul.lobby li.open .pname{color:var(--ink-soft); font-style:italic}
ul.lobby .num{font-family:var(--display); font-weight:700; color:var(--wine)}
ul.lobby .pname{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ptags{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end}
ul.lobby .team.t0{color:#9a6a12; border-color:#d6b46a} ul.lobby .team.t1{color:#2f5d8a; border-color:#9ab9d6}
.opp .top{flex-wrap:wrap; row-gap:4px}
.opp .name{flex:1 1 70px}
.tag.dark{border-color:#cdbf9f; color:var(--ink-soft)}
.btn.mini{padding:4px 10px; font-size:13px}
.btn.light{border-color:var(--brass); color:var(--brass)}
.opp .btn.mini{align-self:flex-start}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:40; max-width:min(92vw, 520px); background:var(--cream); color:var(--ink); padding:10px 16px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.4); font-size:15px; text-align:center}
.rulehint{font-size:14px; color:var(--brass) !important; font-style:italic}
.seg.grid{display:grid; grid-template-columns:1fr 1fr}
.cols,.col,.below{display:flex; flex-direction:column; gap:16px; min-width:0}
.below{width:100%; max-width:470px; margin-inline:auto}
@media (min-width:820px){
  .sheet.menu{max-width:920px; padding:28px 32px}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:start}
  .cols .col + .col{border-left:1px solid #e0d5bb; padding-left:32px}
  .below{border-top:1px solid #e0d5bb; padding-top:18px}
}
.custom{display:flex; flex-direction:column; gap:14px; padding:14px; border:1px solid #e0d5bb; border-radius:8px; background:#fbf6ea}
.radios{display:flex; flex-direction:column; gap:10px}
.log{margin:0; padding-left:18px; color:var(--ink); display:flex; flex-direction:column; gap:4px; font-size:15px}
.sheet.wide{max-width:560px}
.scroll{overflow-x:auto}
.sum thead th small{display:block; font-size:11px; letter-spacing:0; text-transform:none; font-weight:400}

@media (max-width:480px){
  .table{gap:7px; padding:12px 8px}

  .brand{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>

<div class="app">
  <header>
    <h1 class="brand">Scopa</h1>
    <div class="score" id="score"></div>
    <button class="btn" id="menuBtn" type="button">Menü</button>
  </header>
  <section class="opps" id="opps" aria-label="Mitspieler"></section>
  <section class="table" id="table" aria-label="Tisch"></section>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="opts" id="opts"></div>
  <div class="handrow"><div aria-hidden="true"></div><section class="hand" id="hand" aria-label="Karten auf der Hand"></section><div class="mypile" id="myPile"></div></div>
  <section class="zone">
    <div class="me" id="meName"></div>
    <div class="chips" id="myChips"></div>
  </section>
</div>
<div id="overlay"></div>

<script>
const SUITS=['D','C','S','B'];
const SUIT_NAME={D:'Denari',C:'Coppe',S:'Spade',B:'Bastoni'};
const RANK_NAME={1:'Asso',8:'Fante',9:'Cavallo',10:'Re'};
const RANK_SHORT={1:'A',8:'F',9:'C',10:'R'};
const SUIT_COLOR={D:'#b8860b',C:'#a8322a',S:'#2f5d8a',B:'#3d7a3a'};
const PV={7:21,6:18,1:16,5:15,4:14,3:13,2:12,8:10,9:10,10:10};
const nm=c=>`${RANK_NAME[c.v]||c.v} di ${SUIT_NAME[c.s]}`;

/* ---------- card artwork ---------- */
function sym(s,x,y,k){
  const col=SUIT_COLOR[s]; let g;
  if(s==='D') g=`<circle r="7" fill="${col}" stroke="#6b4e0a" stroke-width="1"/><circle r="4.2" fill="none" stroke="#f3e2a8" stroke-width="1"/><circle r="1.4" fill="#6b4e0a"/>`;
  else if(s==='C') g=`<path d="M-7,-7 H7 Q7,2.5 0,3.5 Q-7,2.5 -7,-7Z" fill="${col}"/><path d="M-5,-5 H5" stroke="#f3d2a0" stroke-width="1"/><rect x="-1.1" y="3" width="2.2" height="3.8" fill="${col}"/><rect x="-4.8" y="6.4" width="9.6" height="2" rx="1" fill="${col}"/>`;
  else if(s==='S') g=`<path d="M0,-10 L2.2,3.5 L-2.2,3.5Z" fill="${col}"/><rect x="-6" y="3.5" width="12" height="2" rx="1" fill="#6b4e0a"/><rect x="-1" y="5.5" width="2" height="3.4" fill="#6b4e0a"/><circle cy="9.6" r="1.5" fill="#6b4e0a"/>`;
  else g=`<g transform="rotate(-18)"><path d="M-2.4,-9.5 Q0,-11 2.4,-9.5 L1.8,9 Q0,10.2 -1.8,9Z" fill="${col}"/><circle cx="2.4" cy="-3" r="1.3" fill="${col}"/><circle cx="-2.3" cy="2" r="1.3" fill="${col}"/><circle cx="2" cy="5.5" r="1.1" fill="${col}"/></g>`;

const PIPS={1:[[30,46]],2:[[30,25],[30,67]],3:[[30,19],[30,46],[30,73]],4:[[19,25],[41,25],[19,67],[41,67]],
  5:[[19,22],[41,22],[30,46],[19,70],[41,70]],6:[[19,20],[41,20],[19,46],[41,46],[19,72],[41,72]],

const SKIN='#e9c6a0', DARK='#4a3b2a', GOLD='#d4a43a', FUR='#fbf7ee', HORSE='#8a5a33', HORSE_D='#5e3b1f';
const GRIP={D:[0,6],C:[0,5],S:[0,7],B:[2.2,6]};
/* draws the suit symbol so its grip point sits in the hand at (hx,hy); flip turns it 180° (blade down) */
function held(s,hx,hy,k,flip){
  const [gx,gy]=GRIP[s];
  const cx=flip?hx+gx*k:hx-gx*k, cy=flip?hy+gy*k:hy-gy*k;
  const g=sym(s,cx,cy,k).replace('<g transform="translate('+cx+','+cy+') scale('+k+')">','<g transform="translate('+cx+','+cy+')'+(flip?' rotate(180)':'')+' scale('+k+')">');

  const halo=g.replace(/ stroke="[^"]*"/g,'').replace(/ stroke-width="[^"]*"/g,'').replace(/fill="[^"]*"/g,'fill="#f6efdf"');

}

function cardSVG(c){

  else body=`<rect x="11" y="14" width="38" height="64" rx="3" fill="none" stroke="${col}" stroke-width="1" opacity=".4"/>${figure(c)}<text x="30" y="74.5" text-anchor="middle" ${f} font-size="${c.v===9?6:6.6}" fill="${col}">${RANK_NAME[c.v].toUpperCase()}</text>`;

const cardDiv=(c,cls='')=>`<div class="card ${cls}" data-id="${c.id}" role="img" aria-label="${nm(c)}">${cardSVG(c)}</div>`;

/* ---------- settings ---------- */
const COMP_NAMES=['Don Denari','Settebello-Sepp','Primiera-Paolo','Scopatron 3000','Nonna Bytes','Robo Ravioli','Cavallo Calcolo'];
/* names that were in the list before; still recognised so saved seats get a current name */
const RETIRED=['Computer','Re Algoritmo','Mamma Mia 2.0','Bastoni-Bot','Luigi Logik','Signora Silicio'];
const isCompName=n=>!n||RETIRED.includes(n)||COMP_NAMES.includes(n);
const DEFAULT_SEATS=[{name:'Spieler 1',ai:false},{name:'Don Denari',ai:true},{name:'Spieler 3',ai:false},{name:'Spieler 4',ai:false}];
const MODES={
  house:{name:'Hausregeln', classic:false, ace:'eleven', teams:false, free:true, desc:'Einfache Primiera (mehr Siebener gewinnt), das Ass zählt beim Nehmen 1 oder 11, freie Wahl zwischen Einzelkarte und Kombination, zu viert spielt jeder für sich.'},
  classic:{name:'Klassisch', classic:true, ace:'one', teams:true, free:false, desc:'Primiera mit Punktwerten, das Ass zählt 1, eine passende Einzelkarte hat Vorrang vor Kombinationen, zu viert zwei gegen zwei.'},
  asso:{name:'Asso piglia tutto', classic:true, ace:'all', teams:true, free:false, desc:'Wie Klassisch, aber ein ausgespieltes Ass nimmt den ganzen Tisch. Das zählt nicht als Scopa.'},
  custom:{name:'Eigene Regeln', desc:'Stell die Regeln unten selbst zusammen.'}
};
function rulesOf(s){ const m=MODES[s.mode]; return (s.mode==='custom'||!m)?{...s.custom}:{classic:m.classic, ace:m.ace, teams:m.teams, free:m.free}; }
function loadSettings(){
  let s={};
  try{ s=JSON.parse(localStorage.getItem('scopa-settings'))||{}; }catch(e){}
  const seats=DEFAULT_SEATS.map((d,i)=>{
    const o=s.seats&&s.seats[i];
    const ai=o?!!o.ai:d.ai;
    let name=(o&&typeof o.name==='string'&&o.name.trim())||d.name;
    if(ai&&RETIRED.includes(name)) name=COMP_NAMES[i];
    return {name, ai};
  });
  const c=s.custom||{};
  const custom={classic:s.custom?!!c.classic:!!s.classic, ace:['one','eleven','all'].includes(c.ace)?c.ace:'one', teams:s.custom?c.teams!==false:s.teams!==false, free:!!c.free};
  return {target:s.target===21?21:11, values:s.values!==false, anim:s.anim!==false, players:[2,3,4].includes(s.players)?s.players:2, mode:MODES[s.mode]?s.mode:'house', custom, seats, where:s.where==='online'?'online':'local', oname:typeof s.oname==='string'?s.oname.slice(0,16):''};
}
function saveSettings(s){ try{ localStorage.setItem('scopa-settings', JSON.stringify(s)); }catch(e){} }

/* ---------- game state ---------- */
let S=null, ui={menu:true, started:false, values:loadSettings().values, anim:loadSettings().anim, revealed:null, animUntil:0};
let timers=[];
const later=(ms,fn)=>timers.push(setTimeout(fn,ms));
const clearTimers=()=>{timers.forEach(clearTimeout); timers=[];};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newDeck(){const d=[];for(const s of SUITS)for(let v=1;v<=10;v++)d.push({s,v,id:s+v});return shuffle(d);}

const N=()=>S.players.length;
const humans=()=>S.players.map((p,i)=>p.ai?null:i).filter(i=>i!==null);
const soloHuman=()=>humans().length===1;
const sideOf=p=>S.players[p].side;
/* "Du" when you play alone against computers, otherwise the player's name */
const label=p=>(S.online&&ON&&p===ON.seat)?'Du':(soloHuman()&&!S.players[p].ai?'Du':S.players[p].name);
const isDu=p=>label(p)==='Du';
function sideLabel(i){
  if(S.teams) return 'Team '+'AB'[i];
  return label(i);
}
const teamMembers=i=>S.players.filter(p=>p.side===i).map(p=>p.name).join(' + ');

function newGame(settings){
  clearTimers();
  const R=rulesOf(settings), n=settings.players, teams=n===4&&!!R.teams;
  const players=settings.seats.slice(0,n).map((s,i)=>({name:s.name.trim()||('Spieler '+(i+1)), ai:!!s.ai, side:teams?i%2:i}));
  if(players.every(p=>p.ai)) players[0].ai=false;
  const sides=teams?2:n;
  S={players, teams, sides, scores:Array(sides).fill(0), dealer:Math.floor(Math.random()*n), round:0, settings:{...settings,...R}, phase:'play'};
  startRound();
}
function startRound(){
  const n=N();
  S.round++; S.dealer=(S.dealer+1)%n;
  S.deck=newDeck(); S.hand=Array.from({length:n},()=>[]);
  S.piles=Array.from({length:S.sides},()=>[]); S.scope=Array(S.sides).fill(0);
  S.table=S.deck.splice(0,4); S.last=null; S.sel=null; S.pending=null; S.summary=null;
  S.log=[]; S.lastMove=Array(n).fill(-1);
  deal(); S.turn=(S.dealer+1)%n; S.phase='play'; ui.revealed=null; S.dealt='round';
  S.msg=isDu(S.turn)?'Du beginnst. Wähle eine Karte.':`${label(S.turn)} beginnt.`;
  render(); proceed();
}
function deal(){const n=N();for(let i=0;i<3;i++)for(let k=0;k<n;k++)S.hand[(S.dealer+1+k)%n].push(S.deck.pop());}

const aceRule=()=>(S&&S.settings&&S.settings.ace)||'one';
const takesAll=card=>card.v===1&&aceRule()==='all';
const freeRule=()=>!!(S&&S.settings&&S.settings.free);
/* with "1 oder 11" a played ace may take cards that add up to 11 */
const goalOf=card=>card.v===1&&aceRule()==='eleven'?11:card.v;
function options(card,table){
  if(takesAll(card)) return table.length?[[...table]]:[];
  const same=table.filter(t=>t.v===card.v).map(t=>[t]);
  if(same.length&&!freeRule()) return same;
  return [...same, ...combos(goalOf(card),table)];
}
/* combinations that the single-card rule forbids right now (shown as a hint) */
function blockedCombos(card,table){
  if(freeRule()||takesAll(card)||!table.some(t=>t.v===card.v)) return [];
  return combos(goalOf(card),table);
}
function combos(goal,table){
  const res=[], n=table.length;
  for(let m=1;m<(1<<n);m++){
    if((m&(m-1))===0) continue;
    let sum=0; const set=[];
    for(let i=0;i<n;i++) if(m&(1<<i)){sum+=table[i].v; set.push(table[i]); if(sum>goal) break;}
    if(sum===goal && set.length>1) res.push(set);
  }
  return res;
}
const handTotal=()=>S.hand.reduce((s,h)=>s+h.length,0);

function moveText(p,card,opt){
  const du=isDu(p), who=label(p);
  if(opt&&takesAll(card)) return `${who} ${du?'spielst':'spielt'} ${nm(card)} und ${du?'nimmst':'nimmt'} den ganzen Tisch (${opt.length} Karten). Asso piglia tutto!`;
  if(opt) return `${who} ${du?'spielst':'spielt'} ${nm(card)} und ${du?'nimmst':'nimmt'} ${opt.map(nm).join(' + ')}.`;
  return `${who} ${du?'legst':'legt'} ${nm(card)} auf den Tisch.`;
}
function play(p,cardId,opt){
  if(S.online){ if(S.turn===p) onlinePlay(cardId,opt); return; }
  if(S.pending||S.phase!=='play'||S.turn!==p) return;
  const card=S.hand[p].find(c=>c.id===cardId); if(!card) return;
  S.hand[p]=S.hand[p].filter(c=>c.id!==cardId); S.sel=null;
  S.pending={p,card,ids:opt?opt.map(c=>c.id):null};
  S.msg=moveText(p,card,opt);
  S.log.push({p,text:S.msg}); S.lastMove[p]=S.log.length-1;
  render();
  later(S.players[p].ai?1300:550, commit);
}
function commit(){
  if(!S.pending) return;
  const fly=S.pending.ids?grabFlying():[];
  const {p,card,ids}=S.pending; S.pending=null;
  const side=sideOf(p);
  const lastPlay=S.deck.length===0&&handTotal()===0;
  if(ids){
    const set=new Set(ids), taken=S.table.filter(c=>set.has(c.id));
    S.table=S.table.filter(c=>!set.has(c.id));
    S.piles[side].push(card,...taken); S.last=side;
    if(S.table.length===0&&!lastPlay&&!takesAll(card)){
      S.scope[side]++; flash(side);
      S.log[S.log.length-1].text+=' Scopa!';
    }
  } else S.table.push(card);
  S.turn=(p+1)%N();
  if(handTotal()===0){
    if(S.deck.length){ deal(); S.dealt='hands'; }
    else { endRound(); return; }
  }
  if(isDu(S.turn)) S.msg+=' Du bist dran.';
  else if(!S.players[S.turn].ai) S.msg+=` ${label(S.turn)} ist dran.`;
  render(); proceed();
  flyToPile(fly,side);
}

/* ---------- scoring ---------- */
const cnt=(p,v)=>p.filter(c=>c.v===v).length;
function primSum(p){let sum=0;for(const s of SUITS){const cs=p.filter(c=>c.s===s);if(!cs.length)return null;sum+=Math.max(...cs.map(c=>PV[c.v]));}return sum;}
function uniqueMax(vals){
  let best=null, idx=null, tie=false;
  vals.forEach((v,i)=>{ if(v===null) return; if(best===null||v>best){best=v; idx=i; tie=false;} else if(v===best) tie=true; });
  return tie?null:idx;
}
function bestVec(vecs){
  const cmp=(a,b)=>{for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return a[i]-b[i]; return 0;};
  let w=0, tie=false;
  for(let i=1;i<vecs.length;i++){const c=cmp(vecs[i],vecs[w]); if(c>0){w=i; tie=false;} else if(c===0) tie=true;}
  return tie?null:w;
}
function scoreRound(){
  const P=S.piles, rows=[];
  const n=P.map(p=>p.length);
  rows.push({label:'Karten', vals:n, w:uniqueMax(n)});
  const d=P.map(p=>p.filter(c=>c.s==='D').length);
  rows.push({label:'Denari', vals:d, w:uniqueMax(d)});
  const sb=P.findIndex(p=>p.some(c=>c.s==='D'&&c.v===7));
  rows.push({label:'Settebello', vals:P.map((_,i)=>i===sb?'✓':'–'), w:sb<0?null:sb});
  if(S.settings.classic){
    const x=P.map(primSum);
    rows.push({label:'Primiera', vals:x.map(v=>v===null?'Farbe fehlt':v), w:uniqueMax(x)});
  } else {
    const vecs=P.map(p=>[7,6,1,5,4,3,2].map(v=>cnt(p,v)));
    rows.push({label:'Primiera', vals:P.map(p=>`${cnt(p,7)}× 7 · ${cnt(p,6)}× 6`), w:bestVec(vecs)});
  }
  rows.forEach(r=>r.pts=P.map((_,i)=>r.w===i?1:0));
  rows.push({label:'Scope', vals:[...S.scope], pts:[...S.scope]});
  return rows;
}
function endRound(){
  const rest=S.table.length, restTo=S.last;
  if(rest&&restTo!==null) S.piles[restTo].push(...S.table);
  S.table=[];
  const rows=scoreRound(), gained=Array(S.sides).fill(0);
  rows.forEach(r=>r.pts.forEach((v,i)=>gained[i]+=v));
  gained.forEach((g,i)=>S.scores[i]+=g);
  const t=S.settings.target, reached=S.scores.some(x=>x>=t), w=uniqueMax(S.scores);
  const over=reached&&w!==null;
  S.summary={rows,rest,restTo,gained,winner:over?w:null};
  S.phase=over?'gameEnd':'roundEnd';
  S.msg='Runde vorbei.'; ui.revealed=null;
  render();
}

/* ---------- computer ---------- */
function worth(c){let w=1;if(c.s==='D')w+=2;if(c.v===7)w+=3;else if(c.v===6)w+=1.5;else if(c.v===1)w+=1;if(c.s==='D'&&c.v===7)w+=10;return w;}
function risk(t){if(!t.length)return 0;const sum=t.reduce((s,c)=>s+c.v,0);return sum<=10?7:0;}
function aiMove(p){
  const lastPlay=S.deck.length===0&&handTotal()===1;
  let best=null;
  const consider=(card,opt,sc)=>{if(!best||sc>best.sc)best={card,opt,sc};};
  for(const c of S.hand[p]){
    const opts=options(c,S.table);
    if(!opts.length){consider(c,null,-worth(c)*1.3-risk([...S.table,c])+Math.random()*.6);continue;}
    for(const o of opts){
      const ids=new Set(o.map(x=>x.id)), rest=S.table.filter(x=>!ids.has(x.id));
      let sc=worth(c)+o.reduce((s,x)=>s+worth(x),0);
      if(!rest.length&&!lastPlay&&!takesAll(c)) sc+=14;
      sc-=risk(rest); sc+=Math.random()*.6;
      consider(c,o,sc);
    }
  }
  return best;
}
/* decides what happens next: computer moves on its own, a human waits (behind the cover screen when several share the device) */
function proceed(){
  if(S&&S.online){ onlineProceed(); return; }
  if(!S||ui.menu||S.phase!=='play'||S.pending) return;
  const p=S.turn;
  if(S.players[p].ai){
    later(Math.max(750, ui.animUntil-Date.now()+300),()=>{ if(ui.menu||S.turn!==p||S.pending||S.phase!=='play') return; const m=aiMove(p); play(p,m.card.id,m.opt); });
  }
}
const needsCover=()=>!S.online&&S.phase==='play'&&!S.pending&&!ui.menu&&!S.players[S.turn].ai&&humans().length>1&&ui.revealed!==S.turn;
function viewer(){
  if(S.online) return ON?ON.seat:null;
  const h=humans();
  if(h.length===1) return h[0];
  if(ui.revealed===null) return null;
  if(S.turn===ui.revealed&&!needsCover()) return ui.revealed;
  if(S.pending&&S.pending.p===ui.revealed) return ui.revealed;
  return null;
}

/* ---------- player input ---------- */
function canAct(){const v=viewer(); return S.phase==='play'&&!S.pending&&!ui.menu&&v!==null&&v===S.turn&&!(S.online&&ON&&ON.busy)&&Date.now()>=ui.animUntil;}
function selectCard(id){
  if(!canAct()) return;
  const p=S.turn;
  if(S.sel===id){
    const card=S.hand[p].find(c=>c.id===id), opts=options(card,S.table);
    if(opts.length<=1){ play(p,id,opts[0]||null); return; }
  }
  S.sel=id; render();
}
function tableClick(id){
  if(!S.sel||!canAct()) return;
  const p=S.turn, card=S.hand[p].find(c=>c.id===S.sel);
  if(!card) return;
  const opts=options(card,S.table).filter(o=>o.some(c=>c.id===id));
  if(opts.length===1) play(p,S.sel,opts[0]);
}
function highlight(ids){
  document.querySelectorAll('#table .card').forEach(el=>el.classList.toggle('target',!!ids&&ids.includes(el.dataset.id)));
}

/* ---------- rendering ---------- */
function flash(side){

function sideChips(side){

}
/* face-down pile of captured cards; it grows in layers like the deck shrinks */
function pileHTML(side){
  const n=S.piles[side]?S.piles[side].length:0, layers=n>20?3:n>8?2:n?1:0, rot=['-6deg','5deg','-2deg'];
  return `<div class="cpile ${n?'':'empty'}" data-side="${side}" role="img" aria-label="Gesammelt: ${n} Karten">${Array.from({length:layers},(_,i)=>`<div class="card back" style="--r:${rot[i]}"></div>`).join('')}<b>${n}</b></div>`;
}
/* captured cards fly from the table into the capturer's pile */
function grabFlying(){
  return [...document.querySelectorAll('#table .card.taken, #table .card.incoming')].map(el=>({el:el.cloneNode(true), r:el.getBoundingClientRect()}));
}
function flyToPile(items,side){
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!items||!items.length||!ui.anim||reduce) return;
  const target=document.querySelector(`#myPile .cpile[data-side="${side}"]`)||document.querySelector(`.cpile[data-side="${side}"]`);
  if(!target) return;
  const t=target.getBoundingClientRect();
  if(!t.width) return;
  items.forEach(({el,r},i)=>{
    if(!el.animate||!r.width) return;
    el.classList.remove('taken','incoming','opp','target'); el.classList.add('flying');
    Object.assign(el.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'25'});
    document.body.appendChild(el);
    const dx=t.left+t.width/2-(r.left+r.width/2), dy=t.top+t.height/2-(r.top+r.height/2), sc=Math.max(.2,t.width/r.width);
    const a=el.animate([{transform:'none',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${sc}) rotate(${i%2?9:-9}deg)`,opacity:.7}],
      {duration:440, delay:i*55, easing:'cubic-bezier(.45,.05,.3,1)', fill:'forwards'});
    a.onfinish=()=>el.remove();
    setTimeout(()=>el.remove(),1600);
  });
  setTimeout(()=>{
    const p=document.querySelector(`#myPile .cpile[data-side="${side}"]`)||document.querySelector(`.cpile[data-side="${side}"]`);
    if(p&&p.animate) p.animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:280, easing:'ease-out'});
  }, 440+55*(items.length-1));
}
/* online host only: after 20 s of waiting, a silent player's seat can go to the computer */
function replaceBtn(p){
  if(!S.online||!ON||ON.seat!==0||S.phase!=='play'||S.turn!==p||S.players[p].ai||p===ON.seat) return '';
  if(Date.now()-ON.turnSince<20000) return '';
  return `<button class="btn mini light" type="button" data-replace="${p}">Computer übernimmt</button>`;
}
function seatTag(p){
  const pl=S.players[p], bits=[];
  if(S.teams) bits.push(`<span class="team t${pl.side}">Team ${'AB'[pl.side]}</span>`);

}
function render(skipOverlay){
  const st=S.settings, n=N(), v=viewer(), bottom=v!==null?v:S.turn;
  const myTurn=canAct();

  $('score').innerHTML=S.phase==='lobby'?'':S.scores.map((x,i)=>`<span class="sc ${S.teams?'t'+i:''}" ${S.teams?`title="${esc(teamMembers(i))}"`:''}><em>${esc(sideLabel(i))}</em><b>${x}</b></span>`).join('<span class="sep">·</span>')+`<small>bis ${st.target}</small>`;

  // other seats, in turn order after the bottom seat
  const others=[]; for(let k=1;k<n;k++) others.push((bottom+k)%n);
  $('opps').innerHTML=others.map(p=>`<div data-seat="${p}" class="opp ${S.turn===p&&S.phase==='play'?'active':''}">
      <div class="top"><span class="name">${esc(label(p))}</span><span class="tags">${seatTag(p)}</span></div>${replaceBtn(p)}
      <div class="opp-body"><div class="opp-cards">${S.hand[p].map(()=>'<div class="card back" aria-hidden="true"></div>').join('')||'<span class="none">keine Karten</span>'}</div>${pileHTML(sideOf(p))}</div>

    </div>`).join('');
  $('opps').querySelectorAll('[data-replace]').forEach(b=>b.addEventListener('click',()=>{ b.disabled=true; onlineAction('replace',{seat:+b.dataset.replace}); }));

  // table
  const P=S.pending, taken=new Set(P&&P.ids?P.ids:[]);
  let selOpts=[];
  if(S.sel&&myTurn){const card=S.hand[S.turn].find(c=>c.id===S.sel); if(card) selOpts=options(card,S.table);}
  const autoIds=selOpts.length===1?selOpts[0].map(c=>c.id):[];
  const left=S.deck.length, layers=left>20?3:left>8?2:left?1:0;
  let html=`<div class="deckpile ${left?'':'gone'}" role="img" aria-label="Stapel: ${left} Karten">${Array.from({length:layers},(_,i)=>`<div class="card back" style="--i:${i}"></div>`).join('')}<b>${left||''}</b></div>`;
  html+=S.table.map(c=>cardDiv(c,taken.has(c.id)?'taken':autoIds.includes(c.id)?'target':'')).join('');
  if(P) html+=cardDiv(P.card,'incoming'+(P.p!==v?' opp':''));
  if(!S.table.length&&!P) html+='<span class="empty">Der Tisch ist leer.</span>';

  $('msg').textContent=S.msg||'';

  // bottom seat: your hand (face up only when it is really yours to see)
  const face=v===bottom;
  $('hand').className='hand'+(myTurn?'':' wait');
  if(face){
    const hand=[...S.hand[bottom]].sort((a,b)=>a.v-b.v||a.s.localeCompare(b.s));
    $('hand').innerHTML=hand.map(c=>`<button type="button" class="card ${S.sel===c.id?'sel':''}" data-id="${c.id}" aria-label="${nm(c)}" ${myTurn?'':'disabled'}>${cardSVG(c)}</button>`).join('');
    $('hand').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectCard(b.dataset.id)));
  } else {
    $('hand').innerHTML=S.hand[bottom].map(()=>'<div class="card back" aria-hidden="true"></div>').join('');
  }
  $('myPile').innerHTML=pileHTML(sideOf(bottom))+'<span class="pilelbl">Gesammelt</span>';
  $('meName').innerHTML=`<span class="who">${esc(label(bottom))}</span>${seatTag(bottom)}`;
  const side=sideOf(bottom);
  $('myChips').innerHTML=(S.teams?`<span class="chip">Team ${'AB'[side]}: ${esc(teamMembers(side))}</span>`:'')+sideChips(side)+`<span class="chip">Modus: ${(MODES[st.mode]||MODES.house).name}</span>`;

  // options
  let o='';
  if(myTurn&&S.sel){
    if(!selOpts.length) o=`<p>Mit dieser Karte kannst du nichts nehmen.</p><button class="btn primary" data-o="-1" type="button">Auf den Tisch legen</button>`;
    else if(selOpts.length===1) o=`<button class="btn primary" data-o="0" type="button">${takesAll(S.hand[S.turn].find(c=>c.id===S.sel))?`Ganzen Tisch nehmen (${selOpts[0].length} Karten)`:'Nehmen: '+selOpts[0].map(nm).join(' + ')}</button>`;
    else o=`<p>Wähle, was du nimmst:</p>`+selOpts.map((op,i)=>`<button class="btn" data-o="${i}" type="button">${op.map(nm).join(' + ')}</button>`).join('');
  } else if(myTurn) o=`<p>Tippe eine Karte an. Zweimal tippen spielt sie direkt.</p>`;
  if(myTurn&&S.sel){
    const card=S.hand[S.turn].find(c=>c.id===S.sel), blocked=card?blockedCombos(card,S.table):[];
    if(blocked.length) o+=`<p class="rulehint">${blocked.length===1?'Die Kombination':'Die Kombinationen'} ${blocked.map(b=>b.map(c=>RANK_NAME[c.v]||c.v).join(' + ')).join(' oder ')} ${blocked.length===1?'ist':'sind'} nicht erlaubt, weil eine passende Einzelkarte auf dem Tisch liegt.</p>`;
  }
  $('opts').innerHTML=o;
  $('opts').querySelectorAll('button').forEach(b=>{
    const i=+b.dataset.o, op=selOpts[i];
    b.addEventListener('click',()=>play(S.turn,S.sel,i<0?null:op));
    if(selOpts.length>1&&op){
      b.addEventListener('mouseenter',()=>highlight(op.map(c=>c.id)));
      b.addEventListener('focus',()=>highlight(op.map(c=>c.id)));
      b.addEventListener('mouseleave',()=>highlight(null));
      b.addEventListener('blur',()=>highlight(null));
    }
  });

  if(!skipOverlay) renderOverlay();
  if(S.dealt){ const k=S.dealt; S.dealt=null; animateDeal(k); }
}

/* cards fly from the deck pile to the table and to every seat, in dealing order */
function animateDeal(kind){
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!ui.anim||reduce) return;
  const pile=document.querySelector('#table .deckpile')||$('table');
  if(!pile.getBoundingClientRect) return;
  const from=pile.getBoundingClientRect();
  const seq=[];
  if(kind==='round') document.querySelectorAll('#table > .card[data-id]').forEach(el=>seq.push(el));
  const n=N(), v=viewer(), bottom=v!==null?v:S.turn, start=(S.dealer+1)%n;
  const handEls=p=>p===bottom?[...$('hand').querySelectorAll('.card')]:[...document.querySelectorAll(`.opp[data-seat="${p}"] .opp-cards .card`)];
  const per=[]; for(let k=0;k<n;k++) per.push(handEls((start+k)%n));
  for(let i=0;i<3;i++) per.forEach(list=>{ if(list[i]) seq.push(list[i]); });
  const dur=360, step=kind==='round'?55:45;
  let any=false;
  seq.forEach((el,i)=>{
    if(!el.animate) return;
    const r=el.getBoundingClientRect(); if(!r.width) return;
    const dx=from.left+from.width/2-(r.left+r.width/2), dy=from.top+from.height/2-(r.top+r.height/2);
    const sc=Math.max(.3,Math.min(1,from.width/r.width));
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc})`,opacity:.4},{transform:'none',opacity:1}],
      {duration:dur, delay:i*step, easing:'cubic-bezier(.2,.75,.3,1)', fill:'backwards'});
    any=true;
  });
  if(!any) return;
  const total=dur+step*Math.max(0,seq.length-1);
  ui.animUntil=Date.now()+total;
  setTimeout(()=>{ if(S&&Date.now()>=ui.animUntil) render(true); }, total+30);
}

function renderOverlay(){
  const ov=$('overlay');
  if(ui.menu){ if(!$('menuForm')){ ov.innerHTML=menuHTML(); bindMenu(); } return; }
  if(S.online&&S.phase==='lobby'){ ov.innerHTML=lobbyHTML(); bindLobby(); return; }
  if(S.phase==='roundEnd'||S.phase==='gameEnd'){ ov.innerHTML=summaryHTML(); bindSummary(); return; }
  if(needsCover()){ ov.innerHTML=coverHTML(); $('reveal').addEventListener('click',()=>{ui.revealed=S.turn; render();}); $('reveal').focus(); return; }
  ov.innerHTML='';
}

function bindMenu(){
  const count=()=>[2,3,4].find(k=>$('p'+k).checked);
  const mode=()=>Object.keys(MODES).find(k=>$('mode-'+k).checked);
  const customRules=()=>({classic:$('classic').checked, ace:$('ace-all').checked?'all':$('ace-eleven').checked?'eleven':'one', teams:$('mteam').checked, free:$('free').checked});
  const online=()=>$('w-online').checked;
  const sync=()=>{
    const k=count(), m=mode();
    $('seats').hidden=online(); $('onlineBox').hidden=!online();
    $('mainSubmit').textContent=online()?'Raum erstellen':(ui.started?'Neues Spiel':'Spiel starten');
    for(let i=0;i<4;i++) $('seat'+i).hidden=i>=k;
    const teamsOn=k===4&&(m==='custom'?$('mteam').checked:MODES[m].teams);
    $('teamHint').hidden=!teamsOn;
    $('seats').classList.toggle('teams',teamsOn);
    $('modeDesc').textContent=MODES[m].desc;
    $('customBox').hidden=m!=='custom';
    $('teamsField').hidden=k!==4;
  };
  [2,3,4].forEach(k=>$('p'+k).addEventListener('change',sync));
  ['w-local','w-online'].forEach(id=>$(id).addEventListener('change',()=>{ sync(); saveSettings({...loadSettings(), where:online()?'online':'local'}); }));
  Object.keys(MODES).forEach(k=>$('mode-'+k).addEventListener('change',sync));
  ['mteam','msolo'].forEach(id=>$(id).addEventListener('change',sync));
  /* computer seats get a computer name; switching back to a human restores "Spieler N" */
  const pickName=i=>{
    const used=[0,1,2,3].filter(j=>j!==i).map(j=>$('name'+j).value.trim());
    const free=COMP_NAMES.filter(n=>!used.includes(n)&&n!==$('name'+i).value.trim());
    return free[Math.floor(Math.random()*free.length)]||COMP_NAMES[0];
  };
  for(let i=0;i<4;i++){
    $('ai'+i).addEventListener('change',()=>{
      const ai=$('ai'+i).value==='1', inp=$('name'+i), cur=inp.value.trim();
      if(ai&&(!cur||/^Spieler \d$/.test(cur))) inp.value=pickName(i);
      if(!ai&&isCompName(cur)) inp.value='Spieler '+(i+1);
      const re=$('re'+i); re.classList.toggle('off',!ai); if(ai){re.removeAttribute('tabindex'); re.removeAttribute('aria-hidden');} else {re.tabIndex=-1; re.setAttribute('aria-hidden','true');}
    });
    $('re'+i).addEventListener('click',()=>{ $('name'+i).value=pickName(i); });
  }
  const collect=()=>{
    const players=count();
    const seats=[0,1,2,3].map(i=>({name:$('name'+i).value.trim()||DEFAULT_SEATS[i].name, ai:$('ai'+i).value==='1'}));
    if(seats.slice(0,players).every(x=>x.ai)) seats[0].ai=false;
    return {target:$('t21').checked?21:11, values:$('values').checked, anim:$('anim').checked, players, mode:mode(), custom:customRules(), seats, where:online()?'online':'local', oname:$('oname').value.trim().slice(0,16)};
  };
  const onlineName=()=>{ const n=$('oname').value.trim(); if(!n){ $('oerr').textContent='Trag zuerst deinen Namen ein.'; $('oname').focus(); return null; } return n; };
  const busy=(on)=>{ ['mainSubmit','ojoin'].forEach(id=>{ if($(id)) $(id).disabled=on; }); };
  $('menuForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const s=collect(); saveSettings(s); ui.values=s.values;
    if(s.where==='online'){
      const name=onlineName(); if(!name) return;
      $('oerr').textContent=''; busy(true);
      try{
        const r=await api('create',{name, players:s.players, settings:{mode:s.mode, custom:s.custom, target:s.target}});
        await enterOnline({code:r.code, roomId:r.roomId, seat:r.seat, token:r.token},{id:r.roomId, version:r.version, state:r.state});
      }catch(err){ if($('oerr')) $('oerr').textContent=err.message; busy(false); }
      return;
    }
    leaveOnline(true);
    ui.menu=false; ui.started=true;
    $('overlay').innerHTML='';
    newGame(s);
  });
  $('ojoin').addEventListener('click',async ()=>{
    const s=collect(); saveSettings(s);
    const name=onlineName(); if(!name) return;
    const code=$('ocode').value.toUpperCase().replace(/[^A-Z]/g,'');
    if(code.length!==4){ $('oerr').textContent='Der Raum-Code hat vier Buchstaben.'; $('ocode').focus(); return; }
    $('oerr').textContent=''; busy(true);
    try{
      const r=await api('join',{code, name});
      ui.joinCode='';
      await enterOnline({code:r.code, roomId:r.roomId, seat:r.seat, token:r.token},{id:r.roomId, version:r.version, state:r.state});
    }catch(err){ if($('oerr')) $('oerr').textContent=err.message; busy(false); }
  });
  $('ocode').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('ojoin').click(); } });
  const lo=$('leaveOn'); if(lo) lo.addEventListener('click',()=>leaveOnline());
  sync();
  $('anim').addEventListener('change',e=>{
    ui.anim=e.target.checked;
    saveSettings({...loadSettings(), anim:ui.anim});
  });
  $('values').addEventListener('change',e=>{
    ui.values=e.target.checked;
    saveSettings({...loadSettings(), values:ui.values});
    render(true);
  });
  const r=$('resume'); if(r) r.addEventListener('click',()=>{ui.menu=false; $('overlay').innerHTML=''; render(); proceed();});
}

      <tr class="total"><th>Gesamt</th>${cols.map(i=>`<td>${S.scores[i]}</td>`).join('')}</tr></tfoot></table></div>

        ?'<button class="btn" type="button" id="toMenu">Raum verlassen</button>'+(ON&&ON.seat===0?'<button class="btn primary" type="button" id="again">Nochmal spielen</button>':'')
        :'<button class="btn" type="button" id="toMenu">Menü</button><button class="btn primary" type="button" id="again">Nochmal spielen</button>')
      :'<button class="btn primary" type="button" id="next">Nächste Runde</button>'}</div>

function saveSession(){ try{ localStorage.setItem('scopa-online', JSON.stringify(ON?{code:ON.code,roomId:ON.roomId,seat:ON.seat,token:ON.token}:null)); }catch(e){} }

const sbHeaders={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
async function api(action,body={}){
  let r;
  try{ r=await fetch(SB_URL+'/functions/v1/scopa',{method:'POST',headers:sbHeaders,body:JSON.stringify({action,...body})}); }
  catch(e){ throw new Error(NET_ERR); }
  const j=await r.json().catch(()=>({error:'Unerwartete Antwort vom Server.'}));
  if(!r.ok||j.error) throw new Error(j.error||'Serverfehler, bitte nochmal versuchen.');
  return j;
}
async function rest(path,opts={}){
  let r;
  try{ r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:sbHeaders}); }
  catch(e){ throw new Error(NET_ERR); }
  if(!r.ok) throw new Error('Serverfehler beim Laden.');
  return r.json();
}
async function fetchRoom(code){ const rows=await rest(`scopa_rooms?code=eq.${encodeURIComponent(code)}&select=id,version,state`); return rows[0]||null; }
async function fetchHand(){
  const rows=await rest('rpc/scopa_my_hand',{method:'POST',body:JSON.stringify({p_room:ON.roomId,p_token:ON.token})});
  return rows&&rows[0]?rows[0].cards:null;
}
let sbLib=null;
function loadSupabase(){
  if(window.supabase&&window.supabase.createClient) return Promise.resolve(window.supabase);
  if(!sbLib) sbLib=new Promise((res,rej)=>{const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; s.onload=()=>res(window.supabase); s.onerror=rej; document.head.appendChild(s);});
  return sbLib;
}
function toast(text){
  const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=text;
  document.body.appendChild(el); setTimeout(()=>el.remove(),4200);
}

async function enterOnline(sess,row){
  leaveOnline(true);
  clearTimers();
  ON={code:sess.code, roomId:sess.roomId||row.id, seat:sess.seat, token:sess.token, version:-1, st:null, hand:[], queue:[], busy:false, turnSince:Date.now()};
  saveSession();
  ui.menu=false; ui.started=true; $('overlay').innerHTML='';
  try{ history.replaceState(null,'','#'+sess.code); }catch(e){}
  await applyRow(row,false);
  if(!ON) return;
  ON.poll=setInterval(async()=>{
    if(!ON) return;
    try{ const r=await fetchRoom(ON.code); if(!ON) return; if(!r){ roomGone(); return; } onRow(r); }catch(e){}
  },3000);
  loadSupabase().then(lib=>{
    if(!ON||!lib||!lib.createClient) return;
    const client=lib.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
    ON.client=client;
    ON.chan=client.channel('scopa-'+ON.code)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'scopa_rooms',filter:'code=eq.'+ON.code},p=>onRow(p.new))
      .subscribe();
  }).catch(()=>{});
}
function leaveOnline(silent){
  if(!ON) return;
  const o=ON; ON=null;
  clearInterval(o.poll); clearTimeout(o.aiTimer); clearTimeout(o.waitTimer);
  try{ if(o.client&&o.chan) o.client.removeChannel(o.chan); }catch(e){}
  if(!silent&&o.st&&o.st.status==='lobby') api('leave',{code:o.code,token:o.token}).catch(()=>{});
  saveSession();
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(!silent){ ui.menu=true; $('overlay').innerHTML=''; newGame(loadSettings()); }
}
function roomGone(){ toast('Diesen Raum gibt es nicht mehr.'); leaveOnline(); }
function seatLost(){ toast('Dein Platz in diesem Raum ist nicht mehr gültig, zum Beispiel weil der Computer ihn übernommen hat.'); leaveOnline(); }

function onRow(row){
  if(!ON||!row||!row.state) return;
  if(row.version<=ON.version||ON.queue.some(q=>q.version===row.version)) return;
  ON.queue.push(row); ON.queue.sort((a,b)=>a.version-b.version);
  pump();
}
async function pump(){
  if(!ON||ON.pumping) return;
  ON.pumping=true;
  try{
    while(ON&&ON.queue.length){
      const row=ON.queue.shift();
      if(row.version<=ON.version) continue;
      await applyRow(row,true);
    }
  } finally { if(ON) ON.pumping=false; }
}
async function applyRow(row,animate){
  const prev=ON.st, st=row.state, la=st.lastAction;
  let fly=null;
  if(animate&&prev&&prev.status==='play'&&la&&la.moveNo===(prev.moveNo||0)+1){
    // show the move on the old table first, then the new state
    const hand=la.seat===ON.seat?ON.hand.filter(c=>c.id!==la.card.id):ON.hand;
    const counts=[...prev.handCounts]; counts[la.seat]=Math.max(0,(counts[la.seat]||0)-1);
    S=buildS({...prev,handCounts:counts},hand);
    S.pending={p:la.seat,card:la.card,ids:la.taken.length?la.taken.map(c=>c.id):null};
    S.msg=(st.log&&st.log.length?st.log[st.log.length-1].text:st.msg)||'';
    render(ui.menu);
    await sleep(la.seat===ON.seat?500:1200);
    if(!ON) return;
    if(la.scopa) flash(st.players[la.seat].side);
    if(la.taken.length) fly={items:grabFlying(), side:st.players[la.seat].side};
  }
  if(row.id) ON.roomId=row.id;
  if(prev&&prev.turn!==st.turn) ON.turnSince=Date.now();
  ON.st=st; ON.version=row.version;
  if(ON.nextHand&&ON.nextHand.version===row.version){ ON.hand=ON.nextHand.hand; ON.nextHand=null; }
  if(st.status==='lobby') ON.hand=[];
  else if((st.handCounts[ON.seat]||0)!==ON.hand.length){
    try{ const h=await fetchHand(); if(!ON) return; if(h===null){ seatLost(); return; } ON.hand=h; }catch(e){}
  }
  S=buildS(st,ON.hand);
  if(prev&&st.status==='play'){
    const sum=a=>(a||[]).reduce((x,y)=>x+y,0);
    if(prev.status!=='play'||prev.round!==st.round) S.dealt='round';
    else if(sum(st.handCounts)>sum(prev.handCounts)) S.dealt='hands';
  }
  render(ui.menu);
  if(fly&&st.status==='play') flyToPile(fly.items,fly.side);
  onlineProceed();
}
function buildS(st,hand){
  const keepSel=S&&S.online&&hand.some(c=>c.id===S.sel)?S.sel:null;
  const mine=st.status==='play'&&st.turn===ON.seat, sides=st.sides||st.players.length;
  return {online:true, players:st.players.map((p,i)=>({...p,name:p.name||'Freier Platz',side:p.side??i})), teams:!!st.teams, sides:st.sides,
    scores:Array.from({length:sides},(_,i)=>(st.scores||[])[i]||0), round:st.round, dealer:st.dealer, turn:st.turn, table:st.table||[],
    deck:Array(st.deckCount||0).fill(0), hand:st.players.map((_,i)=>i===ON.seat?[...hand]:Array(st.handCounts[i]||0).fill(0)),
    piles:Array.from({length:sides},(_,i)=>Array((st.pileCounts||[])[i]||0).fill(0)), scope:Array.from({length:sides},(_,i)=>(st.scope||[])[i]||0), phase:st.status,
    settings:st.settings, log:st.log||[], lastMove:st.lastMove||[], summary:st.summary,
    msg:(st.msg||'')+(mine?' Du bist dran.':''), sel:keepSel, pending:null};
}
async function onlinePlay(cardId,opt){
  if(!ON||ON.busy) return;
  ON.busy=true; S.sel=null; render();
  try{
    const res=await api('play',{code:ON.code,token:ON.token,card:cardId,take:opt?opt.map(c=>c.id):null});
    if(!ON) return;
    ON.nextHand={version:res.version,hand:res.hand};
    ON.busy=false;
    onRow({id:ON.roomId,version:res.version,state:res.state});
  }catch(e){ toast(e.message); if(ON){ ON.busy=false; render(); } }
}
async function onlineAction(action,extra={}){
  if(!ON) return;
  try{ const r=await api(action,{code:ON.code,token:ON.token,...extra}); if(ON&&r.state) onRow({id:ON.roomId,version:r.version,state:r.state}); }
  catch(e){ toast(e.message); }
}
/* the first human at the table asks the server for computer moves; the others step in if that device went quiet */
function onlineProceed(){
  if(!ON||!ON.st) return;
  const st=ON.st;
  clearTimeout(ON.aiTimer); clearTimeout(ON.waitTimer);
  if(st.status==='play'&&st.players[st.turn].ai){
    const mv=st.moveNo, first=st.players.findIndex(p=>!p.ai);
    ON.aiTimer=setTimeout(()=>{
      if(!ON||ON.st.moveNo!==mv||ON.st.status!=='play') return;
      api('ai',{code:ON.code,moveNo:mv}).then(r=>{ if(ON&&r.state) onRow({id:ON.roomId,version:r.version,state:r.state}); }).catch(()=>{});
    }, (ON.seat===first?800:6000)+Math.max(0,ui.animUntil-Date.now()));
  }
  if(st.status==='play'&&ON.seat===0&&!st.players[st.turn].ai&&st.turn!==ON.seat){
    ON.waitTimer=setTimeout(()=>render(ui.menu), Math.max(0,20500-(Date.now()-ON.turnSince)));
  }
}

function bindLobby(){
  const copy=(text,label)=>{
    const done=()=>toast(label+' kopiert.');
    try{ navigator.clipboard.writeText(text).then(done,()=>selectText()); }catch(e){ selectText(); }
  };
  const selectText=()=>{ const el=$('linkText'); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Link markiert, jetzt kopieren.'); };
  $('copyCode').addEventListener('click',()=>copy(ON.code,'Code'));

  $('leaveRoom').addEventListener('click',()=>leaveOnline());

}
async function tryResume(){
  const sess=loadSession();
  if(!sess||!sess.code||!sess.token) return false;
  try{
    const row=await fetchRoom(sess.code);
    if(!row||row.id!==sess.roomId){ ON=null; saveSession(); return false; }
    await enterOnline(sess,row);
    return !!ON;
  }catch(e){ return false; }
}

/* ---------- boot (keeps a running game across page updates) ---------- */
function start(data){
  const hash=(location.hash||'').replace('#','').toUpperCase();
  if(/^[A-Z]{4}$/.test(hash)){ ui.joinCode=hash; saveSettings({...loadSettings(), where:'online'}); }
  if(data&&data.S&&data.S.online) data={};
  tryResume();
  if(data&&data.S&&data.S.players){
    S=data.S; ui={...ui,...(data.ui||{})};
    if(ui.values===undefined) ui.values=loadSettings().values;
    if(S.pending){ const p=S.pending; S.pending=null; S.hand[p.p].push(p.card); S.log.pop(); }
    render(); proceed();
  } else { newGame(loadSettings()); }
}

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
