    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#felt)"/>
  <g filter="url(#sh)">
    <!-- oben links: Karte (Scopa) -->
    <rect x="92" y="92" width="152" height="152" rx="30" fill="#8c2c2a"/>
    <g transform="rotate(-8 168 168)">
      <rect x="132" y="113" width="72" height="110" rx="10" fill="#f6efdf"/>
