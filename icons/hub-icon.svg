    <g transform="translate(344 344)" stroke="#d6ac55" stroke-width="9" stroke-linejoin="round" fill="none">
      <path d="M0 -48L42 -24V24L0 48L-42 24V-24Z" fill="rgba(214,172,85,.15)"/>
