      <circle cx="168" cy="168" r="11" fill="none" stroke="#f3e2a8" stroke-width="4"/>
    </g>
    <!-- oben rechts: Jahreszeitenrad (Tempora) -->
    <rect x="268" y="92" width="152" height="152" rx="30" fill="#f6efdf"/>
    <g transform="translate(344 168)">
      <path d="M0 0V-50A50 50 0 0 1 50 0Z" fill="#9A6A0E"/>
